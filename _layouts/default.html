<!doctype html>
<!-- Shared reading shell: palette is independent of light/dark appearance. -->
<!-- Explicit reading_theme paper/ink hints light/dark; a saved user choice wins. -->
<html lang="{{ page.lang | default: site.lang | escape }}" data-color-scheme="{{ page.color_scheme | default: 'grapevine' | validated_color_scheme }}"{% if page.reading_theme == 'ink' %} data-appearance="dark"{% elsif page.reading_theme == 'paper' %} data-appearance="light"{% endif %}>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <!-- Initialize appearance before styles paint; enhance the button after parsing. -->
    <script src="{{ '/assets/js/appearance.js' | relative_url }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400&amp;family=Fondamento&amp;display=swap">
    <!-- A build revision avoids reusing cached styles after appearance updates. -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body{% if page.url == '/' %} class="home-page"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="pelgish.ink" title="pelgish.ink">
            <span class="site-logo" aria-hidden="true"></span>
        </a>
        <button id="appearance-toggle" class="icon-control" type="button" hidden aria-label="Switch appearance">
            <span class="control-icon appearance-moon" aria-hidden="true"></span>
            <span class="control-icon appearance-sun" aria-hidden="true"></span>
        </button>
    </header>
    <main id="main" tabindex="-1">
        {{ content }}
    </main>
</body>
</html>
