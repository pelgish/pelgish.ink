<!doctype html>
<!-- Shared, script-free reading shell. -->
<html lang="{{ page.lang | default: site.lang | escape }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body{% if page.reading_theme == 'ink' %} class="theme-ink"{% endif %}>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="Main">
            <a href="{{ '/' | relative_url }}">Writing</a>
        </nav>
    </header>
    <main id="main" tabindex="-1">
        {{ content }}
    </main>
    <footer class="site-footer">
        <a href="{{ '/' | relative_url }}">All writing</a>
    </footer>
</body>
</html>
