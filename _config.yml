# Static site and opt-in Markdown writing under content/.
title: pelgish.ink
description: Creative writing from Connor
url: "https://pelgish.ink"
baseurl: ""
lang: en
copyright_start_year: 2026

defaults:
    - scope:
          path: ""
      values:
          layout: default
          color_scheme: grapevine
    - scope:
          path: content/
          type: pages
      values:
          layout: prose
          published: false
          literary_content: true

markdown: kramdown
kramdown:
    input: GFM
    hard_wrap: false
strict_front_matter: true

include:
    - content/haiku/_random.md

exclude:
    - "**/*:sec.endpointdlp"
    - README.md
    - Gemfile
    - Gemfile.lock
    - vendor
    - scripts
