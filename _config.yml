# Static site and opt-in Markdown writing under content/.
title: pelgish.ink
description: Creative writing from Connor
url: "https://pelgish.ink"
baseurl: ""
lang: en

defaults:
    - scope:
          path: ""
      values:
          layout: default
          reading_theme: paper
    - scope:
          path: content/
          type: pages
      values:
          layout: prose
          published: false
          literary_content: true

markdown: kramdown
kramdown:
    input: GFM
    hard_wrap: false
strict_front_matter: true

exclude:
    - README.md
    - Gemfile
    - Gemfile.lock
    - vendor
    - scripts
