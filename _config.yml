# Static site and standalone writing collection.
title: pelgish.ink
description: Creative writing from Connor
url: "https://pelgish.ink"
baseurl: ""
lang: en

collections:
    writing:
        output: true
        permalink: /:path/

defaults:
    - scope:
          path: ""
      values:
          layout: default
          reading_theme: paper
    - scope:
          path: ""
          type: writing
      values:
          layout: prose
          published: false

markdown: kramdown
kramdown:
    input: GFM
    hard_wrap: false
strict_front_matter: true

exclude:
    - README.md
    - Gemfile
    - Gemfile.lock
    - vendor
    - scripts
